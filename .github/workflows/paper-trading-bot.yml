name: Paper Trading Bot

on:
  schedule:
    # Hourly at :35 from 13:35 to 20:35 UTC, weekdays — covers the US
    # trading session (~9:35am-4:35pm ET during daylight saving time;
    # UTC doesn't shift for DST, so this runs ~1h earlier in winter).
    - cron: '35 13-20 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run paper trading bot
        run: python paper-trading/bot.py

      - name: Commit updated state
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "actions@github.com"
          git add paper-trading/state.json
          git diff --quiet --cached || git commit -m "Update paper trading state ($(date -u +%Y-%m-%d))"
          git push
