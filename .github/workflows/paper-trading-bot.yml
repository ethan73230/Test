name: Paper Trading Bot

on:
  schedule:
    - cron: '0 22 * * 1-5'  # ~weekdays after US market close
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run paper trading bot
        run: python paper-trading/bot.py

      - name: Commit updated state
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "actions@github.com"
          git add paper-trading/state.json
          git diff --quiet --cached || git commit -m "Update paper trading state ($(date -u +%Y-%m-%d))"
          git push
