name: Paper Trading Bot

on:
  schedule:
    # 13:35 UTC = 9:35am ET during US daylight saving time (spring-fall).
    # UTC doesn't shift for DST, so this runs ~8:35am ET in winter (EST) —
    # about an hour before the real open the rest of the year.
    - cron: '35 13 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run paper trading bot
        run: python paper-trading/bot.py

      - name: Commit updated state
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "actions@github.com"
          git add paper-trading/state.json
          git diff --quiet --cached || git commit -m "Update paper trading state ($(date -u +%Y-%m-%d))"
          git push
