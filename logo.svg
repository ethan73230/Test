<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 917 1218" width="917" height="1218">
  <g fill="none" stroke="#4a5a6a" stroke-linecap="round" stroke-linejoin="round">

    <!-- Cercle extérieur -->
    <circle cx="490" cy="580" r="415" stroke-width="5"/>

    <!-- ===== CHIFFRE "5" (côté gauche) ===== -->

    <!-- Barre supérieure du 5 (horizontale en haut) -->
    <line x1="215" y1="115" x2="400" y2="115" stroke-width="11"/>

    <!-- Côté gauche vertical (haut) -->
    <line x1="215" y1="115" x2="215" y2="330" stroke-width="11"/>

    <!-- Barre médiane horizontale du 5 -->
    <line x1="215" y1="330" x2="395" y2="330" stroke-width="11"/>

    <!-- Bol inférieur du 5 — grande courbe C -->
    <path d="
      M 395,330
      C 470,330 500,380 500,450
      C 500,550 435,630 340,638
      C 250,645 180,590 178,510
      C 176,455 215,415 255,405
    " stroke-width="11"/>

    <!-- Boucle/spirale caractéristique en haut gauche du 5 -->
    <path d="
      M 390,115
      C 380,102 350,96 315,104
      C 250,118 200,170 210,245
      C 218,308 272,336 330,336
    " stroke-width="9"/>
    <path d="M 262,200 C 246,162 264,128 294,137 C 322,147 323,180 302,197" stroke-width="7"/>

    <!-- ===== CHIFFRE "2" (côté droit) ===== -->

    <!-- Arc supérieur du 2 — version bloc rectangulaire avec diagonale -->
    <rect x="438" y="108" width="186" height="240" stroke-width="11"/>
    <line x1="438" y1="108" x2="624" y2="348" stroke-width="11"/>

    <!-- Corps bas du 2 — cercle avec trou en serrure -->
    <circle cx="560" cy="532" r="115" stroke-width="11"/>
    <!-- Cercle intérieur -->
    <circle cx="560" cy="566" r="43" stroke-width="10"/>
    <!-- Encoche / ouverture en bas (serrure) -->
    <path d="M 540,605 L 540,654 L 580,654 L 580,605" stroke-width="9"/>

  </g>
</svg>
